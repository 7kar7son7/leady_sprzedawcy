# Allegro bot – przykładowa konfiguracja
# Skopiuj do config.yaml i dostosuj.

query: "wiertarka"
max_pages: 3
max_sellers: 100
delay_min_sec: 1.5
delay_max_sec: 3.5
headless: false
# true = użyj zainstalowanego Chrome (lepiej przechodzi Captchę)
use_system_chrome: true
# katalog profilu – po przejściu Captchy cookie zostaje
browser_profile_dir: "browser_profile"
output_csv: "data/sellers.csv"
output_sqlite: "data/sellers.sqlite"
