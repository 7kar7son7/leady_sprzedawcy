# Allegro bot – konfiguracja pod hosting / Docker
query: "wiertarka"
max_pages: 3
max_sellers: 100
delay_min_sec: 1.5
delay_max_sec: 3.5

# Na VPS/Docker ZAWSZE true (brak X11 / $DISPLAY)
headless: true
# false w kontenerze – używany jest Chromium z Playwright
use_system_chrome: false

browser_profile_dir: "browser_profile"
output_csv: "data/sellers.csv"
output_sqlite: "data/sellers.sqlite"
